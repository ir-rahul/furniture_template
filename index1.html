<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Automation Engine - GLB Configurator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
        color: #333;
      }

      #container {
        display: flex;
        height: 100vh;
        gap: 0;
      }

      #canvas-container {
        flex: 1;
        position: relative;
        background: #1a1a2e;
      }

      #control-panel {
        width: 380px;
        background: white;
        overflow-y: auto;
        box-shadow: -5px 0 20px rgba(0, 0, 0, 0.2);
      }

      .panel-section {
        padding: 24px;
        border-bottom: 1px solid #e0e0e0;
      }

      .panel-section h2 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #667eea;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #upload-zone {
        border: 3px dashed #667eea;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: #f8f9ff;
      }

      #upload-zone:hover {
        border-color: #764ba2;
        background: #f0f1ff;
      }

      #upload-zone.drag-over {
        background: #e8e9ff;
        border-color: #764ba2;
      }

      .upload-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        opacity: 0.6;
      }

      #file-input {
        display: none;
      }

      .control-group {
        margin-bottom: 20px;
      }

      .control-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #555;
      }

      .color-picker-group {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      input[type="color"] {
        width: 60px;
        height: 40px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .part-name {
        flex: 1;
        font-size: 14px;
        color: #666;
      }

      button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        width: 100%;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
        margin-top: 8px;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .animation-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .animation-btn {
        padding: 10px;
        font-size: 12px;
        background: #f8f9ff;
        color: #667eea;
        border: 2px solid #e0e0ff;
      }

      .animation-btn.active {
        background: #667eea;
        color: white;
        border-color: #667eea;
      }

      .slider-control {
        width: 100%;
      }

      input[type="range"] {
        width: 100%;
        margin-top: 8px;
      }

      .camera-presets {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .camera-btn {
        padding: 8px;
        font-size: 11px;
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 18px;
        text-align: center;
        display: none;
      }

      .spinner {
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 16px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 24px;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 8px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .part-toggle {
        display: flex;
        align-items: center;
        padding: 10px;
        background: #f8f9ff;
        border-radius: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        transition: all 0.3s;
      }

      .part-toggle:hover {
        background: #f0f1ff;
      }

      .part-toggle input[type="checkbox"] {
        margin-right: 10px;
      }

      #stats {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        display: none;
      }

      #stats div {
        margin-bottom: 4px;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="loading">
          <div class="spinner"></div>
          <div>Processing your 3D model...</div>
        </div>
        <div id="stats"></div>
      </div>

      <div id="control-panel">
        <div class="header">
          <h1>🎨 3D Automation Engine</h1>
          <p>Upload GLB → Get Instant Configurator</p>
        </div>

        <div class="panel-section">
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Upload 3D Model
          </h2>
          <div id="upload-zone">
            <svg
              class="upload-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#667eea"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div style="font-weight: 600; margin-bottom: 8px">
              Drop GLB file here
            </div>
            <div style="font-size: 13px; color: #888">or click to browse</div>
          </div>
          <input type="file" id="file-input" accept=".glb,.gltf" />
        </div>

        <div id="materials-section" class="panel-section" style="display: none">
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="13.5" cy="6.5" r=".5"></circle>
              <circle cx="17.5" cy="10.5" r=".5"></circle>
              <circle cx="8.5" cy="7.5" r=".5"></circle>
              <circle cx="6.5" cy="12.5" r=".5"></circle>
              <path
                d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"
              ></path>
            </svg>
            Materials & Colors
          </h2>
          <div id="materials-list"></div>
        </div>

        <div id="parts-section" class="panel-section" style="display: none">
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7"></rect>
              <rect x="14" y="3" width="7" height="7"></rect>
              <rect x="14" y="14" width="7" height="7"></rect>
              <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Parts Visibility
          </h2>
          <div id="parts-list"></div>
        </div>

        <div
          id="animations-section"
          class="panel-section"
          style="display: none"
        >
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polygon
                points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
              ></polygon>
            </svg>
            Animations
          </h2>
          <div class="animation-controls">
            <button class="animation-btn" data-animation="rotate">
              🔄 Auto Rotate
            </button>
            <button class="animation-btn" data-animation="explode">
              💥 Explode View
            </button>
            <button class="animation-btn" data-animation="bounce">
              ⬆️ Bounce
            </button>
            <button class="animation-btn" data-animation="pulse">
              💓 Pulse
            </button>
          </div>
          <div class="control-group" style="margin-top: 16px">
            <label>Explosion Amount</label>
            <input
              type="range"
              id="explosion-slider"
              min="0"
              max="3"
              step="0.1"
              value="0"
              class="slider-control"
            />
          </div>
        </div>

        <div id="camera-section" class="panel-section" style="display: none">
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              ></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            Camera Presets
          </h2>
          <div class="camera-presets">
            <button class="camera-btn btn-secondary" data-preset="front">
              Front
            </button>
            <button class="camera-btn btn-secondary" data-preset="side">
              Side
            </button>
            <button class="camera-btn btn-secondary" data-preset="top">
              Top
            </button>
            <button class="camera-btn btn-secondary" data-preset="angle">
              Angle
            </button>
            <button class="camera-btn btn-secondary" data-preset="back">
              Back
            </button>
            <button class="camera-btn btn-secondary" data-preset="reset">
              Reset
            </button>
          </div>
        </div>

        <div id="export-section" class="panel-section" style="display: none">
          <h2>
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="8 17 12 21 16 17"></polyline>
              <line x1="12" y1="12" x2="12" y2="21"></line>
              <path
                d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"
              ></path>
            </svg>
            Export Configuration
          </h2>
          <button class="btn-primary" id="export-btn">
            📥 Download Config JSON
          </button>
          <button class="btn-secondary" id="reset-btn">🔄 Reset All</button>
        </div>
      </div>
    </div>

    <script>
      // Global variables
      let scene, camera, renderer, controls, model;
      let parts = [];
      let animations = {
        rotate: false,
        explode: false,
        bounce: false,
        pulse: false,
      };
      let explosionAmount = 0;
      let modelBounds = null;

      // Initialize Three.js scene
      function initScene() {
        const canvas = document.getElementById("canvas");
        const container = document.getElementById("canvas-container");

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        camera = new THREE.PerspectiveCamera(
          50,
          container.clientWidth / container.clientHeight,
          0.1,
          1000
        );
        camera.position.set(5, 5, 5);

        renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 10, 5);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
        directionalLight2.position.set(-5, 5, -5);
        scene.add(directionalLight2);

        // Grid
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
        scene.add(gridHelper);

        window.addEventListener("resize", onWindowResize);
        animate();
      }

      function onWindowResize() {
        const container = document.getElementById("canvas-container");
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        if (model && parts.length > 0) {
          const time = Date.now() * 0.001;

          // Auto rotate
          if (animations.rotate) {
            model.rotation.y += 0.01;
          }

          // Explosion effect
          parts.forEach((partData, index) => {
            const part = partData.mesh;
            if (animations.explode) {
              const direction = new THREE.Vector3();
              direction
                .copy(partData.originalPosition)
                .sub(modelBounds.center)
                .normalize();
              part.position
                .copy(partData.originalPosition)
                .add(direction.multiplyScalar(explosionAmount));
            } else {
              part.position.copy(partData.originalPosition);
            }

            // Bounce
            if (animations.bounce) {
              part.position.y =
                partData.originalPosition.y + Math.sin(time * 2 + index) * 0.2;
            }

            // Pulse
            if (animations.pulse) {
              const scale = 1 + Math.sin(time * 3 + index) * 0.1;
              part.scale.set(scale, scale, scale);
            } else {
              part.scale.set(1, 1, 1);
            }
          });
        }

        controls.update();
        renderer.render(scene, camera);
      }

      // Load GLB file
      function loadGLB(file) {
        document.getElementById("loading").style.display = "block";

        const reader = new FileReader();
        reader.onload = function (e) {
          const loader = new THREE.GLTFLoader();
          loader.parse(
            e.target.result,
            "",
            function (gltf) {
              if (model) {
                scene.remove(model);
              }

              model = gltf.scene;
              scene.add(model);

              // Calculate bounds
              const box = new THREE.Box3().setFromObject(model);
              modelBounds = {
                center: new THREE.Vector3(),
                size: new THREE.Vector3(),
              };
              box.getCenter(modelBounds.center);
              box.getSize(modelBounds.size);

              // Center model
              model.position.sub(modelBounds.center);

              // Fit camera
              const maxDim = Math.max(
                modelBounds.size.x,
                modelBounds.size.y,
                modelBounds.size.z
              );
              const fov = camera.fov * (Math.PI / 180);
              let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
              cameraZ *= 2.5;
              camera.position.set(cameraZ, cameraZ * 0.7, cameraZ);
              camera.lookAt(0, 0, 0);
              controls.target.set(0, 0, 0);

              // Extract parts
              parts = [];
              model.traverse((child) => {
                if (child.isMesh) {
                  parts.push({
                    name: child.name || `Part ${parts.length + 1}`,
                    mesh: child,
                    originalPosition: child.position.clone(),
                    visible: true,
                  });
                }
              });

              generateUI();
              document.getElementById("loading").style.display = "none";
              updateStats();
            },
            function (error) {
              console.error("Error loading model:", error);
              document.getElementById("loading").style.display = "none";
              alert("Error loading model. Please try another file.");
            }
          );
        };
        reader.readAsArrayBuffer(file);
      }

      // Generate UI based on model
      function generateUI() {
        // Materials section
        const materialsSection = document.getElementById("materials-section");
        const materialsList = document.getElementById("materials-list");
        materialsSection.style.display = "block";
        materialsList.innerHTML = "";

        parts.forEach((partData, index) => {
          const controlGroup = document.createElement("div");
          controlGroup.className = "control-group";

          const colorGroup = document.createElement("div");
          colorGroup.className = "color-picker-group";

          const colorInput = document.createElement("input");
          colorInput.type = "color";
          colorInput.value = "#" + partData.mesh.material.color.getHexString();
          colorInput.addEventListener("input", (e) => {
            partData.mesh.material.color.set(e.target.value);
          });

          const partName = document.createElement("div");
          partName.className = "part-name";
          partName.textContent = partData.name;

          colorGroup.appendChild(colorInput);
          colorGroup.appendChild(partName);
          controlGroup.appendChild(colorGroup);
          materialsList.appendChild(controlGroup);
        });

        // Parts visibility section
        const partsSection = document.getElementById("parts-section");
        const partsList = document.getElementById("parts-list");
        partsSection.style.display = "block";
        partsList.innerHTML = "";

        parts.forEach((partData, index) => {
          const partToggle = document.createElement("div");
          partToggle.className = "part-toggle";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = true;
          checkbox.addEventListener("change", (e) => {
            partData.mesh.visible = e.target.checked;
            partData.visible = e.target.checked;
          });

          const label = document.createElement("span");
          label.textContent = partData.name;

          partToggle.appendChild(checkbox);
          partToggle.appendChild(label);
          partsList.appendChild(partToggle);
        });

        // Show other sections
        document.getElementById("animations-section").style.display = "block";
        document.getElementById("camera-section").style.display = "block";
        document.getElementById("export-section").style.display = "block";
      }

      function updateStats() {
        const stats = document.getElementById("stats");
        stats.style.display = "block";
        stats.innerHTML = `
                <div><strong>Model Stats</strong></div>
                <div>Parts: ${parts.length}</div>
                <div>Size: ${modelBounds.size.x.toFixed(
                  2
                )} × ${modelBounds.size.y.toFixed(
          2
        )} × ${modelBounds.size.z.toFixed(2)}</div>
            `;
      }

      // Event listeners
      document.getElementById("upload-zone").addEventListener("click", () => {
        document.getElementById("file-input").click();
      });

      document.getElementById("file-input").addEventListener("change", (e) => {
        if (e.target.files.length > 0) {
          loadGLB(e.target.files[0]);
        }
      });

      // Drag and drop
      const uploadZone = document.getElementById("upload-zone");
      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("drag-over");
      });

      uploadZone.addEventListener("dragleave", () => {
        uploadZone.classList.remove("drag-over");
      });

      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("drag-over");
        if (e.dataTransfer.files.length > 0) {
          loadGLB(e.dataTransfer.files[0]);
        }
      });

      // Animation controls
      document.querySelectorAll(".animation-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const anim = this.dataset.animation;
          animations[anim] = !animations[anim];
          this.classList.toggle("active");
        });
      });

      document
        .getElementById("explosion-slider")
        .addEventListener("input", (e) => {
          explosionAmount = parseFloat(e.target.value);
        });

      // Camera presets
      document.querySelectorAll(".camera-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const preset = this.dataset.preset;
          const distance = 8;

          switch (preset) {
            case "front":
              camera.position.set(0, 0, distance);
              break;
            case "side":
              camera.position.set(distance, 0, 0);
              break;
            case "top":
              camera.position.set(0, distance, 0);
              break;
            case "angle":
              camera.position.set(distance, distance * 0.7, distance);
              break;
            case "back":
              camera.position.set(0, 0, -distance);
              break;
            case "reset":
              camera.position.set(5, 5, 5);
              break;
          }
          camera.lookAt(0, 0, 0);
          controls.target.set(0, 0, 0);
        });
      });

      // Export configuration
      document.getElementById("export-btn").addEventListener("click", () => {
        const config = {
          parts: parts.map((p) => ({
            name: p.name,
            color: "#" + p.mesh.material.color.getHexString(),
            visible: p.visible,
          })),
          animations: animations,
          explosionAmount: explosionAmount,
          timestamp: new Date().toISOString(),
        };

        const blob = new Blob([JSON.stringify(config, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "3d-config.json";
        a.click();
      });

      // Reset
      document.getElementById("reset-btn").addEventListener("click", () => {
        if (confirm("Reset all settings?")) {
          location.reload();
        }
      });

      // Initialize
      initScene();
    </script>
  </body>
</html>
